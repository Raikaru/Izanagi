[mod]
id = p4pc.hardmode
name = Hard mode
version = 1.5.0
api = 1.6
requires = stage.damage@1, stage.chance@1, battle.menu@1, battle.substitute@1, ui.sprite@1, ui.overlay@1, manifest.table-delta@1, manifest.element-header@1, manifest.element-prompt@1, table-source.item-derive@1, table-source.skill-source@1, table-source.skill-derive@1, table-source.skill-delivery@1
priority = 0
order = 0

# OFF by default. The difficulty and features chosen here are armed at the next
# New Game (or, once, on the next loaded save without hard-mode rules) and are
# saved with that run. A loaded hard-mode save keeps the rules it started with.
# Tuning numbers live in files/DATA/HARDMODE/TUNING.TXT.

# Hard mode is built on Physical Split's Slash/Strike/Pierce: enabling hard
# mode enables Physical Split with its split on, and both stay locked together
# while hard mode is enabled. Physical Split alone does not need hard mode.
[require p4pc.physsplit]
version = 1.0
setting.split = on

# With Golden mechanics enabled, hard mode reads which of its table groups are
# active: Golden's enemy rows take their own per-boss tuning.
[companion p4pc.golden]
version = 0.1

[setting mode]
kind = choice
choices = Off | Hard | Harder
default = Off
label = DIFFICULTY
help = Applies from the next New Game. OFF: the original game. HARD: ordinary enemies have a little more HP and hit much harder, more so in later dungeons; bosses have changing tactics. HARDER: as HARD, with a little more SP and speed for ordinary enemies, stronger bosses and battle rewards to match.
group = DIFFICULTY

[setting enemy_stats]
kind = toggle
default = on
label = ENEMY STAT TUNING
help = Enemy HP, SP, stats and the damage of their attacks follow the difficulty and the current dungeon, and the Contrarian King and Daring Gigas hit 25% harder. Off keeps every enemy's original stats and damage.
group = FEATURES

[setting smart_ai]
kind = toggle
default = on
label = ENEMY SUPPORT DISCIPLINE
help = Enemies that can heal stop wasting turns healing allies who are barely hurt. Boss battles keep their original behaviour.
group = FEATURES

[setting rewards]
kind = toggle
default = on
label = REWARD TUNING
help = Battle EXP and yen follow the difficulty. Off keeps the original rewards.
group = FEATURES

[setting technical]
kind = toggle
default = on
label = TECHNICAL DAMAGE
help = A hit of the matching element deals 25% more damage to a target already suffering an ailment: Wind on Panic, Ice on Fear, Fire on Rage, Electric on Silence. It works for both sides, not on weaknesses or critical hits, and grants no extra turn.
group = FEATURES

[setting windows]
kind = toggle
default = on
apply = restart
label = BOSS AILMENT WINDOWS
help = Avenger Knight can be Panicked, Shadow Yukiko Feared and Shadow Kanji Enraged, so a Technical can follow. The ailment wears off within two of the boss's turns; then the boss shrugs it off for three turns, at most three times per fight, and never while it charges or on its scripted turns. Outside a hard-mode run with Technical damage, bosses stay immune. Takes effect after a restart.
group = FEATURES

[table-source p4pc.hardmode:windows]
when = windows
file = data/windows.xml
format = p4-tables-xml
schema = 1
revision = 2

[setting rebalance]
kind = toggle
default = on
apply = restart
label = SPELL REBALANCE
help = Medium single-target spells (Agilao, Bufula, Garula, Zionga) hit a little softer, and spells on every enemy cost less but deal 80% of the same tier's single-target damage to each target. Saves made with it need hard mode. Takes effect after a restart.
group = FEATURES

[table-delta rebalance]
when = rebalance
file = data/rebalance.xml
revision = 1

[setting party]
kind = toggle
default = on
apply = restart
label = PARTY SKILLS
help = Yosuke learns Garula at 23 and Yukiko Maragion at 34; Chie learns Frost Dive in place of Assault Dive; Kanji knows Hysterical Slap when he joins, learns Thunder Dive at 28 and Mazionga at 36. Frost Dive and Thunder Dive are Ice and Electric attacks that land like physical ones: they cost HP and can crit. Saves made with it need hard mode. Takes effect after a restart.
group = FEATURES

[table-source p4pc.hardmode:skills]
when = party
file = data/skills.xml
format = p4-tables-xml
schema = 1
revision = 1

[table-delta party]
when = party
file = data/party.xml
revision = 2

[setting gear]
kind = toggle
default = on
apply = restart
label = PHYSICAL GEAR
help = Daidara makes Cleave, Pummel and Stab Linings (armor that cuts one kind of physical damage by 10% without removing a weakness) and a Pierce Ward (an accessory that halves Pierce damage); Slash and Strike Wards follow once you sell Daidara materials from Marukyu Striptease. Saves that hold them need hard mode. Takes effect after a restart.
group = FEATURES

[table-source p4pc.hardmode:gear]
when = gear
file = data/gear.xml
format = p4-tables-xml
schema = 1
revision = 4

[setting boss_rules]
kind = toggle
default = on
label = BOSS TACTICS
help = Bosses fight in changing phases. Avenger Knight, Shadow Yukiko and Shadow Kanji use their own actions to signal dangerous moments. Yukiko calls her Prince once when hurt; Kanji changes formation when hurt or when a guard falls. Nice Guy heals only now and then, while Tough Guy strips your buffs.
group = FEATURES

[setting adopt_on_load]
kind = toggle
default = off
label = START FROM THE NEXT LOADED SAVE
help = Once: the next loaded save that has no hard-mode rules becomes a hard-mode run with the settings above. The save file is unchanged until you save. Such runs are labelled ADOPTED.
group = RUN

# Native UI art (docs/modding/ui_art.md; tools/ui_art/ui_art.py builds every file
# under art/). The Camp root shows the HARD badge while a hard-mode run is active.
[resource-image p4pc.hardmode:badge]
file = art/badge.png
format = png
schema = 1
revision = 1

