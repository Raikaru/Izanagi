[mod]
id = p4pc.hardmode
name = Hard mode
version = 1.6.0
api = 1.6
requires = stage.damage@3, stage.chance@1, stage.enemy-reward@1, battle.menu@1, battle.substitute@1, battle.defeat@1, ui.sprite@1, ui.overlay@2, manifest.table-delta@4, manifest.element-header@1, manifest.element-prompt@1, table-source.item-derive@1, table-source.skill-source@1, table-source.skill-derive@1, table-source.skill-delivery@1, table-source.status@3, data.catalog@1, data.session@1, status@1, events.status@1
priority = 0
order = 0

# OFF by default. The difficulty and features chosen here are armed at the next
# New Game (or, once, on the next loaded save without hard-mode rules) and are
# saved with that run. A loaded hard-mode save keeps the rules it started with.
# Tuning numbers live in files/DATA/HARDMODE/TUNING.TXT.
#
# v1 preview: one tier (HARD) and three feature packages. The former settings
# map as follows; a settings file that still holds them keeps them unread:
#   ENEMY STAT TUNING, ENEMY SUPPORT DISCIPLINE, REWARD TUNING -> ENEMY RULES
#   TECHNICAL DAMAGE, BOSS AILMENT WINDOWS, BOSS TACTICS        -> BOSS PLAY
#   SPELL REBALANCE, PARTY SKILLS, PHYSICAL GEAR                -> PARTY KIT
#   DIFFICULTY HARDER -> OFF (no longer a choice; HARDER saves keep HARDER)
# BATTLE RETRY (an assist, on by default) is a run option beside the packages,
# like START FROM THE NEXT LOADED SAVE.
# FREEZE AND SHOCK is an experimental option, off by default, outside the
# packages until the Fear-versus-Freeze paired cohort decides it.
# A save's own block keeps the run's rules (stats, ai, rewards, technical,
# bosses), so a run started under the nine toggles loads unchanged.

# Hard mode is built on Physical Split's Slash/Strike/Pierce: enabling hard
# mode enables Physical Split with its split on, and both stay locked together
# while hard mode is enabled. Physical Split alone does not need hard mode.
[require p4pc.physsplit]
version = 1.0
setting.split = on

# With Golden mechanics enabled, hard mode reads which of its table groups are
# active: Golden's enemy rows take their own per-boss tuning.
[companion p4pc.golden]
version = 0.1

[setting mode]
kind = choice
choices = Off | Hard
default = Off
label = DIFFICULTY
help = From the next New Game. OFF: the original game. HARD: ordinary enemies have more HP, hit much harder in later dungeons and pay EXP to match; bosses change tactics and keep no elemental weakness (Shadow Yukiko loses Ice, the Golden Avenger Knight Fire; the Prince stays weak to Ice). Golden boss numbers are experimental. HARDER saves keep their rules; a saved HARDER choice reads as OFF. Mid-run it only steps down (HARDER to HARD to OFF), shown as STEPPED on the Camp badge.
group = DIFFICULTY

[setting enemy_rules]
kind = toggle
default = on
apply = restart
label = ENEMY RULES
help = Everything that sizes the other side: enemy HP, SP, stats and the damage of their attacks (the Contrarian King and Daring Gigas hit 25% harder), enemy support discipline (ordinary enemies stop wasting turns healing barely-hurt allies), and battle EXP/yen following the difficulty. Off keeps every enemy's original stats, damage and rewards.
group = FEATURES

[setting boss_play]
kind = toggle
default = on
apply = restart
label = BOSS PLAY
help = Bosses fight in phases and signal danger with their own actions. Technical: a hit of the element matching the target's ailment deals 50% more from the party, 25% more from enemies (TECHNICAL! on the battle panel). Windows: Knight Panic, Yukiko Fear, Kanji Rage, Contrarian King Silence land 30% of the time and cost the boss one turn, once per phase; on charge and scripted turns the boss shrugs them off. The panel says when a boss shrugs it off or recovers. Takes effect after a restart.
group = FEATURES

[table-source p4pc.hardmode:windows]
when = boss_play
file = data/windows.xml
format = p4-tables-xml
schema = 1
revision = 3

[setting party_kit]
kind = toggle
default = on
apply = restart
label = PARTY KIT
help = Skill rebalance for both sides (spells, healing, Life Drain, physical skills; multi-hit physicals share one tier's damage; physical ailments land more often), party skills (Yosuke Garula at 23, Yukiko Maragion at 34, Chie Frost Dive for Assault Dive, Kanji Hysterical Slap on joining, Thunder Dive at 28, Mazionga at 36) and physical gear from Daidara (Linings; Slash, Strike and Pierce Wards after selling Marukyu materials). Saves made with it need hard mode. Takes effect after a restart.
group = FEATURES

[table-delta rebalance]
when = party_kit
file = data/rebalance.xml
revision = 6

[table-source p4pc.hardmode:skills]
when = party_kit
file = data/skills.xml
format = p4-tables-xml
schema = 1
revision = 1

[table-delta party]
when = party_kit
file = data/party.xml
revision = 2

[table-source p4pc.hardmode:gear]
when = party_kit
file = data/gear.xml
format = p4-tables-xml
schema = 1
revision = 5

[setting battle_retry]
kind = toggle
default = on
label = BATTLE RETRY
help = When the party falls to a boss, RETRY BATTLE or GIVE UP is offered before the Game Over. RETRY restarts the same fight at once with everyone's HP, SP, ailments and buffs from its start; items used stay used and Analyze knowledge is kept. GIVE UP is the original Game Over. Ordinary shadows are never retried, and Challenge IRONMAN refuses it with a notice. Saved with the run.
group = FEATURES

[setting freeze_shock]
kind = toggle
default = off
label = FREEZE AND SHOCK
help = Ice skills can freeze and Electric skills can shock. A frozen or shocked fighter loses its next turn and cannot dodge, and every physical hit on it that it does not resist is a critical. Ice shatters on the next damaging hit; a physical hit on a shocked fighter may pass the shock to the attacker. Patra, Me Patra and Amrita cure both. Enemy chances against your party are halved, the protagonist cannot be frozen or shocked, and bosses are immune. Applies from the next New Game.
group = FEATURES

[table-source p4pc.hardmode:freezeshock]
file = data/freezeshock.xml
format = p4-tables-xml
schema = 1
revision = 2

# Frost Dive and Thunder Dive exist only with PARTY KIT (data/skills.xml).
[table-source p4pc.hardmode:freezeshock-dives]
when = party_kit
file = data/freezeshock-dives.xml
format = p4-tables-xml
schema = 1
revision = 1

[setting adopt_on_load]
kind = toggle
default = off
label = START FROM THE NEXT LOADED SAVE
help = Once: the next loaded save that has no hard-mode rules becomes a hard-mode run with the settings above. The save file is unchanged until you save. Such runs are labelled ADOPTED.
group = RUN

# Native UI art (docs/modding/ui_art.md; tools/ui_art/ui_art.py builds every file
