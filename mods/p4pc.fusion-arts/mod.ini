[mod]
id = p4pc.fusion-arts
name = Fusion Arts
version = 0.1.0
api = 1.6
requires = settings@1, ui.page@1, events.field_enter@1, events.frame_start@1, persona.stock@1, social.rank@1, forge@1, forge.vessel@1, equipment@1, inventory@1, party.hero_level@1, data.catalog@1, velvet.command@1, authorize.weapon_fusion@1, manifest.setting@1, manifest.table-source@1, table-source.item-derive@1, table-source.item-icon-anchor@1, manifest.companion@1, manifest.companion-setting@1, story.dungeon_cleared@1
priority = 0
order = 0

# Everything is OFF until switched on. Restart to apply.

[setting weapon_fusion]
kind = toggle
label = WEAPON FUSION
help = Adds WEAPON FUSION to the Velvet Room once the castle is cleared: fuse a carried Persona into an unequipped weapon one of your fighters can use. The Persona and weapon are consumed, plus a fee. The result depends on the Persona's level and arcana; a few Personas make unique weapons.
apply = restart
group = FUSION ARTS

# Forged weapons: derived rows over the user's own item table (tools/mods/fusion_arts_forge.py).
[table-source p4pc.fusion-arts:forge]
when = weapon_fusion
file = data/forge.xml
format = p4-tables-xml
schema = 1
revision = 1

# Optional: with Physical Split on, forged weapons hit with their family's
# leaf (Slash, Strike or Pierce) like the retail weapons it types.
[companion p4pc.physsplit]
version = 1.0

[table-source p4pc.fusion-arts:split]
when = weapon_fusion
companion = p4pc.physsplit
companion-setting = split=on
file = data/split.xml
format = p4-tables-xml
schema = 1
revision = 1