[mod]
id = witness.calendar-pass
name = Calendar pass witness
version = 1.0
api = 1.6
requires = calendar.pass@1
priority = 0
order = 1

# mod_calendar_game's second case: clear the game's staged slot first, so the
# request computes and stages it itself.
[setting clear_staging]
kind = toggle
default = off
apply = restart
label = CLEAR STAGING
help = Witness only: clear the game's staged next time slot before passing.
