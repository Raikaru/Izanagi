[mod]
id = p4pc.physsplit
name = Physical Split
version = 1.0.0
api = 1.2
priority = 0
order = 0

[setting split]
kind = toggle
default = off
label = PHYSICAL SPLIT
help = Slash, Strike and Pierce replace Physical. Weapons, physical skills and enemy attacks each have one type; personas keep their Physical affinity for all three, enemies use reviewed per-type affinities, and Analyze learns each type separately. Takes effect after a restart.
apply = restart

[table-source p4pc.physsplit:split]
when = split
file = data/split.xml
format = p4-tables-xml
schema = 1
revision = 2

[resource-image p4pc.physsplit:slash-icon]
when = split
file = art/slash.png
format = png
schema = 1
revision = 1

[resource-image p4pc.physsplit:strike-icon]
when = split
file = art/strike.png
format = png
schema = 1
revision = 1

[resource-image p4pc.physsplit:pierce-icon]
when = split
file = art/pierce.png
format = png
schema = 1
revision = 1

[element-ui]
when = split
schema = 1
revision = 1
order = p4pc.physsplit:slash, p4pc.physsplit:strike, p4pc.physsplit:pierce, p4:fire, p4:ice, p4:electric, p4:wind, p4:light, p4:dark

[element-column p4pc.physsplit:slash]
component = damage
channel = p4:damage

[element-column p4pc.physsplit:strike]
component = damage
channel = p4:damage

[element-column p4pc.physsplit:pierce]
component = damage
channel = p4:damage

[element-column p4:fire]
component = damage
channel = p4:damage
legacy-primary = fire

[element-column p4:ice]
component = damage
channel = p4:damage
legacy-primary = ice

[element-column p4:electric]
component = damage
channel = p4:damage
legacy-primary = elec

[element-column p4:wind]
component = damage
channel = p4:damage
legacy-primary = wind

[element-column p4:light]
component = instant-ko
channel = p4:instant_ko
legacy-primary = light-ko

[element-column p4:dark]
component = instant-ko
channel = p4:instant_ko
legacy-primary = dark-ko
