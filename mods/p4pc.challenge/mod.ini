[mod]
id = p4pc.challenge
name = Challenge modes
version = 1.0.0
api = 1.6
requires = stage.damage@1, party.record@1, data.original-enemy-level@1, authorize.battle_protection_item@1, authorize.weapon_fusion@1, settings@1, ui.status@1, ui.page@1, save@1, lifecycle@1, events.battle_start@1, events.battle_end@1, events.field_enter@1, events.exit@1, events.menu_open@1, events.menu_close@1, authorize.fusion@1, battle.formation@1, events.frame_start@1, manifest.setting@1
priority = 0
order = 0

# Every rule is OFF. Rules are fixed for a run when a New Game starts; a loaded
# save keeps the rules it was started with.

[setting ironman]
kind = toggle
label = IRONMAN - LOCK ON LOSS
help = A battle loss ends the run: every save of that run is locked, never deleted. Arms only together with the confirmation below.
group = RULES

[setting ironman_confirm]
kind = toggle
label = CONFIRM: A LOSS LOCKS THE RUN
help = Second confirmation for IRONMAN. A terminal loss permanently ends this challenge run; this mod will LOCK, not erase, its saves. There is no undo.
group = RULES

[setting strict_ironman]
kind = toggle
label = STRICT IRONMAN
help = STRICT IRONMAN: exiting while a battle is unresolved ends this run unless the port recorded a crash for that session. Power loss counts as a loss. Saves are locked, not erased. On Android: backgrounding alone is safe, but the OS killing this app while a battle is open counts as an unclean exit and may end the run. Requires IRONMAN and the confirmation below.
group = RULES

[setting strict_confirm]
kind = toggle
label = CONFIRM: STRICT IRONMAN
help = Second confirmation for STRICT IRONMAN. Closing or killing the game during a battle, or losing power, permanently ends this challenge run unless the port itself recorded a crash. This is not crash-proof or power-loss-safe.
group = RULES

[setting boss_cap]
kind = toggle
label = BOSS LEVEL CAP
help = Nobody can level past the level of the next story dungeon boss. Extra EXP is discarded, not banked.
group = RULES

[setting no_fusion]
kind = toggle
label = NO FUSION
help = Persona fusion is unavailable. The compendium and Shuffle Time still work.
group = RULES

[setting no_weapon_fusion]
kind = toggle
label = NO WEAPON FUSION
help = The Fusion Arts WEAPON FUSION command is unavailable and forging is refused before anything is spent. Persona fusion is set separately by NO FUSION.
group = RULES

[setting solo]
kind = choice
choices = OFF | YU | YOSUKE | NAOTO
default = OFF
label = SOLO MEMBER
help = The chosen character fights every battle alone from the first battle of a New Game. YU: Yu Narukami fights alone. YOSUKE or NAOTO: that companion fights alone from level 1 on an early curve of their own Persona, under your direct commands, even before they join the story; Yu stays the story's lead but earns no battle EXP, and the companion's knockout loses the battle. Solo Chie, Yukiko, Kanji and Teddie are coming in a later update.
group = RULES

[setting no_battle_items]
kind = toggle
label = NO ITEMS IN BATTLE
help = The Item command is unavailable in battle.
group = RULES

[setting no_field_recovery]
kind = toggle
label = NO FIELD RECOVERY
help = Outside battle, items and skills that restore HP or SP cannot be used. Status cures, equipment and story recovery still work.
group = RULES

[setting severe_damage]
kind = toggle
label = SEVERE DAMAGE
help = Our own curve, not a port of another game's difficulty: enemy hits on the party do x1.50 damage, party hits on enemies x0.75, and a hit on a weakness or a critical another x1.25. Fixed, percentage, healing and SP amounts are unchanged.
group = RULES

[setting limited_saves]
kind = toggle
label = LIMITED SAVES
help = Three saves per story chapter. Beating the chapter's dungeon boss gives three new saves.
group = RULES

[setting mandatory_only]
kind = toggle
label = MANDATORY BATTLES ONLY
help = Ordinary dungeon Shadows never start a battle: your attack finds no target and their touch is ignored. Story battles, minibosses and bosses are fought as usual. This does not reduce EXP; it prevents the optional fights.
group = RULES

[setting custom_on_load]
kind = toggle
label = START FROM THE NEXT LOADED SAVE
help = Once: the next loaded save that has no challenge rules becomes a CUSTOM run with the rules above. The save file is unchanged until you save. CUSTOM runs are labelled as such everywhere.
group = RUN
