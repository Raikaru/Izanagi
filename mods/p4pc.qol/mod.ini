[mod]
id = p4pc.qol
name = Quality of life
version = 1.0.0
api = 1.6
requires = battle.menu@1, stage.damage@1
priority = 0
order = 0

# Every feature is OFF until the player turns it on in MODS > p4pc.qol.
[setting full_descriptions]
kind = toggle
default = off
group = UI
label = FULL DESCRIPTIONS
help = Help text for skills, items and equipment shows the game's actual numbers: power, hits, accuracy, chances, costs and amounts. Style credits: SoraRoxas (Better Descriptions for P5R) and rudiger (P4G Detailed Descriptions).

[setting description_style]
kind = choice
choices = Simple | Exact
default = Simple
group = UI
label = DESCRIPTION STYLE
help = Simple: damage as a percentage of Agilao's strength (Agilao = 100%), same stats, rounded. Exact: the raw formula power per hit. Kept while FULL DESCRIPTIONS is off.

[setting backlog]
kind = toggle
default = off
group = UI
label = DIALOGUE BACKLOG
help = Keeps the messages of this session's conversations. Read them, newest first, on this page under DIALOGUE BACKLOG. Nothing is saved.

[setting skill_compare]
kind = toggle
default = off
group = UI
label = SKILL COMPARE
help = Lists each party member's skills in their own order with costs, and compares two of them side by side under SKILL COMPARE on this page. Read-only.

[setting compendium_filter]
kind = toggle
default = off
group = UI
label = COMPENDIUM FILTER
help = Browse every Persona by arcana, registration and level or name under COMPENDIUM FILTER on this page, and compare a registered Persona with the one you carry. Read-only.

[setting fusion_results]
kind = toggle
default = off
group = UI
label = FUSION RESULTS
help = Lists what the Personas you carry fuse into, results first, under FUSION RESULTS on this page. Fusion itself stays in the Velvet Room.

[setting glossary]
kind = toggle
default = off
group = UI
label = GLOSSARY
help = Short definitions of the game's terms under GLOSSARY on this page.

[setting fusion_planner]
kind = toggle
default = off
group = UI
label = FUSION PLANNER
help = Pick any Persona under FUSION PLANNER on this page to see which pairs of the Personas you carry or have registered fuse into it. Read-only.

[setting forecast]
kind = toggle
default = off
group = UI
label = FORECAST
help = Today and the next seven days' weather under FORECAST on this page, as the game's own calendar reports it: exact for three days, its forecast after that.

[setting affinity_hints]
kind = toggle
default = off
group = UI
label = AFFINITY HINTS
help = When you choose a target, the markers the navigator's Third Eye gives (the attack will be reflected, or will have no effect) appear from the first battle, for affinities you have already discovered.

[setting camera_speed]
kind = toggle
default = off
group = CAMERA
label = CAMERA SPEED
help = Changes how fast the free dungeon camera turns while you hold L1/R1 or push the right stick. The 45-degree turns, recentering and the fixed town cameras stay as they are.

[setting camera_speed_percent]
kind = choice
choices = 50% | 75% | 125% | 150% | 200%
default = 150%
group = CAMERA
label = TURN SPEED
help = The turning speed while CAMERA SPEED is on, relative to the game's own speed (100%).

[setting audio_volumes]
kind = toggle
default = off
group = AUDIO
label = AUDIO VOLUMES
help = Separate volumes for music, sound effects, voices and movies, on top of the master volume in Config.

[setting music_volume]
kind = choice
choices = 0% | 20% | 40% | 60% | 80% | 100%
default = 100%
group = AUDIO
label = MUSIC VOLUME
help = Background music while AUDIO VOLUMES is on.

[setting effects_volume]
kind = choice
choices = 0% | 20% | 40% | 60% | 80% | 100%
default = 100%
group = AUDIO
label = EFFECTS VOLUME
help = Sound effects while AUDIO VOLUMES is on.

[setting voice_volume]
kind = choice
choices = 0% | 20% | 40% | 60% | 80% | 100%
default = 100%
group = AUDIO
label = VOICE VOLUME
help = Spoken lines in events and battle while AUDIO VOLUMES is on.

[setting movie_volume]
kind = choice
choices = 0% | 20% | 40% | 60% | 80% | 100%
default = 100%
group = AUDIO
label = MOVIE VOLUME
help = The sound of the animated movies while AUDIO VOLUMES is on.

[setting fast_text]
kind = toggle
default = off
group = FLOW
label = FAST TEXT
help = Press START during dialogue to fast-forward it until the next choice; press START again to stop. Holding Triangle (the game's own fast-forward) also skips the pause between lines. Choices, prompts and lines the game does not let you skip still wait for you.

[setting auto_dialogue]
kind = toggle
default = off
group = FLOW
label = AUTO DIALOGUE
help = Dialogue moves on by itself once a line has been shown for the reading delay and any voice line has finished. Choices and prompts still wait for you.

[setting auto_dialogue_delay]
kind = choice
choices = 1s | 2s | 3s | 5s
default = 2s
group = FLOW
label = READING DELAY
help = How long a finished line stays before AUTO DIALOGUE moves on.

[setting skip_seen_movies]
kind = toggle
default = off
group = FLOW
label = SKIP SEEN MOVIES
help = Animated movies you have already watched to the end (with this on) are skipped the way START skips them. The staff roll always plays. Movies you skipped yourself do not count as watched.

[setting party_heal]
kind = toggle
default = off
group = FLOW
label = PARTY HEAL
help = A PARTY HEAL page that plans the party's own healing skills (cheapest SP first) and casts them, with their normal SP cost, when you close the menu. Fallen members are not revived.

[setting direct_commands]
kind = toggle
default = off
group = BATTLE
label = DIRECT COMMANDS
help = Buttons that open Guard, Item or Persona on your command circle, as if you picked it and pressed confirm. The game still decides whether the command can be used.

[setting guard_button]
kind = choice
choices = Off | Square | L2 | R2 | R1
default = Square
group = BATTLE
label = GUARD BUTTON
help = The button for Guard while DIRECT COMMANDS is on.

[setting item_button]
kind = choice
choices = Off | Square | L2 | R2 | R1
default = L2
group = BATTLE
label = ITEM BUTTON
help = The button for Item while DIRECT COMMANDS is on.

[setting persona_button]
kind = choice
choices = Off | Square | L2 | R2 | R1
default = R2
group = BATTLE
label = PERSONA BUTTON
help = The button for Persona while DIRECT COMMANDS is on (the leader only).

[setting weakness_assist]
kind = toggle
default = off
group = BATTLE
label = WEAKNESS ASSIST
help = A button that opens Skill with the cursor on a usable skill that hits a weakness you have already discovered, starting the target choice on that enemy. You still confirm both, or back out.

[setting assist_button]
kind = choice
choices = Off | Square | L2 | R2 | R1
default = R1
group = BATTLE
label = ASSIST BUTTON
help = The button for WEAKNESS ASSIST.

[setting half_sp]
kind = toggle
default = off
group = ASSISTANCE
label = HALF SP COST
help = Party skills cost half their SP (rounded up, at least 1), in battle and in the Camp menu. HP costs, enemies and items are unchanged. Changes the game's balance.

[setting double_money]
kind = toggle
default = off
group = ASSISTANCE
label = DOUBLE BATTLE MONEY
help = The money a won battle awards is doubled, up to the game's own limit. Shops, events and other income are unchanged. Changes the game's balance.

[setting dungeon_dash]
kind = toggle
default = off
group = ASSISTANCE
label = DUNGEON DASH
help = Your own run in the TV world's dungeons is 25% faster while the dash button is held (or always). Towns, other characters and scripted movement are unchanged. Running past Shadows changes the game's balance.

[setting dash_mode]
kind = choice
choices = Hold Square | Hold Circle | Hold L3 | Hold R3 | Always
default = Hold Square
group = ASSISTANCE
label = DASH
help = Which button dashes while DUNGEON DASH is on, or Always.

[setting plan_summons]
kind = toggle
default = off
group = UI
label = PLAN SUMMONS
help = A PLAN SUMMONS page for the Persona planned on FUSION PLANNER: recipes that need registered Personas you do not carry, with the compendium's price. Queue one, and they are summoned as the compendium does when you next reach the Velvet Room's menu.

[setting damage_dealt]
kind = toggle
default = off
group = ASSISTANCE
label = DAMAGE DEALT
help = The damage the party deals to enemies is scaled by the factor below. Heals, fixed and scripted damage and instant death are unchanged; other mods' damage changes (such as hard mode) multiply with this. Changes the game's balance.

[setting damage_dealt_factor]
kind = choice
choices = 0.5x | 2x
default = 2x
group = ASSISTANCE
label = DAMAGE DEALT FACTOR
help = The factor while DAMAGE DEALT is on.

[setting damage_taken]
kind = toggle
default = off
group = ASSISTANCE
label = DAMAGE TAKEN
help = The damage the party takes is scaled by the factor below. Heals, fixed and scripted damage and instant death are unchanged; other mods' damage changes (such as hard mode) multiply with this. Changes the game's balance.

[setting damage_taken_factor]
kind = choice
choices = 0.5x | 2x
default = 2x
group = ASSISTANCE
label = DAMAGE TAKEN FACTOR
help = The factor while DAMAGE TAKEN is on.

[setting battle_exp]
kind = toggle
default = off
group = ASSISTANCE
label = BATTLE EXP
help = The EXP won battles award to every Persona is scaled by the factor below. The result screen's level-ups follow it. Other mods' EXP changes multiply with this. Changes the game's balance.

[setting battle_exp_factor]
kind = choice
choices = 0.5x | 2x
default = 2x
group = ASSISTANCE
label = BATTLE EXP FACTOR
help = The factor while BATTLE EXP is on.

[setting reserve_exp]
kind = toggle
default = off
group = ASSISTANCE
label = RESERVE EXP
help = Party members who have joined but sat a won battle out earn the EXP they would have earned in it, with the game's own level-ups. Changes the game's balance.

[setting relearn_skills]
kind = toggle
default = off
group = ASSISTANCE
label = RELEARN SKILLS
help = Adds the RELEARN SKILLS page: a party member's Persona relearns a skill it learned by its level and later forgot. Free and takes no time.

[setting chosen_inheritance]
kind = toggle
default = off
group = UI
label = CHOSEN INHERITANCE
help = Adds the INHERITANCE page: marked skills that a fusion's ingredients carry and the result can inherit are inherited in place of the game's random picks. How many are inherited stays the game's.
