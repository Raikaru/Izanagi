# Zig Luau implementation: project adaptations of the pinned Luau/Lua sources.
# Host-only State, main, root, p4pc, build and witness files keep project terms.
[[annotations]]
path = [
  "luau-zig/src/compiler.zig",
  "luau-zig/src/compiler/**",
  "luau-zig/src/vm.zig",
  "luau-zig/src/vm/**",
  "luau-zig/src/stdlib.zig",
  "luau-zig/src/stdlib/**",
  "luau-zig/src/require.zig",
  "luau-zig/src/require/**",
]
