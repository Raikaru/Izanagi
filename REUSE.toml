version = 1

# Machine-readable licensing (https://reuse.software). NOTICE explains the terms.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Izanagi contributors"
SPDX-License-Identifier = "MIT"

# Reconstructed from the retail game: no licence granted (LICENSES/LicenseRef-reconstructed.txt).
# overrides/ has no per-file headers: the build splices those files byte for byte into the decomp mirror.
[[annotations]]
path = [
  "overrides/**",
  "drafts/**",
  "src/cri/**",
  "src/platform/ee_libm.c",
  "src/platform/ee_dlibm.c",
  "src/platform/ps2_fpbit.c",
  "src/platform/ee_heap.c",
  "src/platform/rw_device_register.c",
  "src/platform/rw_image_stream.c",
  "src/platform/rw_normalize2.c",
  "src/platform/rw_normalize3.c",
  "src/platform/rw_p2_stalac.c",
  "src/platform/rw_plugin_constructors.c",
  "src/platform/rw_rtanim.c",
  "src/platform/rw_rtanim_record.c",
  "src/platform/rw_skin_callees.c",
  "src/platform/rw_skytran.c",
]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-reconstructed"

[[annotations]]
path = "third_party/luau/**"
precedence = "override"
SPDX-FileCopyrightText = "2019-2026 Roblox Corporation; 1994-2019 Lua.org, PUC-Rio"
