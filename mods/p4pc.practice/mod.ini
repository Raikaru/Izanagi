[mod]
id = p4pc.practice
name = Practice tools
version = 1.0.0
api = 1.6
requires = pace@1
priority = 0
order = 0

[setting warp]
kind = toggle
default = off
label = P01 WARP
group = TRAVEL / CALENDAR
help = Practice only. Load any field and room the disc has through the game's own field load. Story progress is unchanged.

[setting date]
kind = toggle
default = off
label = P02 SET DATE
group = TRAVEL / CALENDAR
help = Practice only. Stage a calendar day and apply it at an idle field or the Camp Config. Missed story events are not replayed.

[setting time]
kind = toggle
default = off
label = P03 SET TIME SLOT
group = TRAVEL / CALENDAR
help = Practice only. Stage one of the six time slots and apply it. The field picks up its lighting on the next field load.

[setting weather]
kind = toggle
default = off
label = P04 SET WEATHER
group = TRAVEL / CALENDAR
help = Practice only. Override today's weather for the current time of day; it ends at the next date or time-slot change.

[setting money]
kind = toggle
default = off
label = P07 MONEY
group = PARTY / INVENTORY
help = Practice only. Set the exact yen amount, 0 to 9,999,999, with a confirmed preview.

[setting items]
kind = toggle
default = off
label = P08 ITEMS
group = PARTY / INVENTORY
help = Practice only. Set the count of one retail item, 0 to 99. Key items also change their event flag.

[setting links]
kind = toggle
default = off
label = P10 SOCIAL LINK RANKS
group = PARTY / INVENTORY
help = Practice only. Set the rank of an existing Social Link, 1 to 10, and rebuild its rank flags. No events or rewards are played.

[setting stats]
kind = toggle
default = off
label = P05 PARTY STATS
group = PARTY / INVENTORY
help = Practice only. Edit current HP/SP of party records and the protagonist's social stat points from an idle field.

[setting levels]
kind = toggle
default = off
label = P06 LEVEL / EXP
group = PARTY / INVENTORY
help = Practice only. Set the protagonist's level up or down with that level's minimum EXP, from an idle field.

[setting personas]
kind = toggle
default = off
label = P09 PERSONAS
group = PARTY / INVENTORY
help = Practice only. Add, remove or lead carried Personas and edit their five stats, from an idle field.

[setting flags]
kind = toggle
default = off
label = P11 STORY FLAGS
group = EVENTS / BATTLES
help = Advanced, practice only. Set or clear one game flag, 0 to 0x15FF. Flags can change story progress in ways the game cannot undo.

[setting encounter]
kind = toggle
default = off
label = P12 START ENCOUNTER
group = EVENTS / BATTLES
help = Practice only. Start a loaded encounter by ID from an idle field and return to it afterwards. A defeat revives the party at 1 HP.

[setting camera]
kind = toggle
default = off
label = P13 FREE CAMERA
group = CAMERA / DISPLAY
help = Detach the view in an idle field. Only drawing changes; the game ignores the pad until you exit with Circle.

[setting hud]
kind = toggle
default = off
label = P14 HIDE HUD
group = CAMERA / DISPLAY
help = Hide the chosen HUD groups in fields and battles. Only drawing stops; menus, prompts and the PRACTICE status stay.

[setting frames]
kind = toggle
default = off
label = P16 FRAME COUNTER
group = TIMING
help = Shows completed game updates, the retail counter and presented frames on the practice status layer.

[setting timer]
kind = toggle
default = off
label = P17 PRACTICE TIMER
group = TIMING
help = Manual start, stop, reset and split. Shows wall time and completed game updates as separate clocks. Not a real-time-attack timer.

[setting pace]
kind = toggle
default = off
label = P15 PRACTICE SPEED
group = TIMING
help = Play at 0.25x to 4x in real-time play; menus and movies run at 1x and audio is muted at other speeds. L3 restores 1x.
