[mod]
id = p4pc.golden
name = Golden mechanics
version = 0.2.0
api = 1.6
requires = manifest.table-derived@2, contract@1, tables.source@1, tables.overlay@1, calendar.pass@2, calendar.hold@1, scene@2, scene.player-position@1
priority = 0
order = 0

# Persona 4 Golden's battle numbers, derived from your own Persona 4 Golden
# (Steam) install at startup; nothing from Golden ships with the port. Enable
# the mod in MODS, then choose the groups below. Changes apply at the next start.
# docs/modding/golden.md

[setting numbers]
kind = toggle
default = on
apply = restart
group = GOLDEN TABLES
label = SKILL AND ITEM NUMBERS
help = Golden's skill numbers (ailment and instant-kill rates, Megido costs, doubled healing items), compendium learnset fixes, armor values and SP item prices.

[setting enemies]
kind = toggle
default = on
apply = restart
group = GOLDEN TABLES
label = ENEMIES
help = Golden's enemy stats, HP, affinities, EXP, money and drops. Enemies keep this game's skill lists, which its battle AI uses.

[setting party]
kind = toggle
default = on
apply = restart
group = GOLDEN TABLES
label = PARTY PERSONAS
help = Golden's party Persona stats, affinities and learnsets. Golden moved some party skills to Social Link ranks, so this applies only with PERSONA SKILLS on.

[setting exp_curves]
kind = toggle
default = on
apply = restart
group = GOLDEN TABLES
label = PARTY EXP CURVES
help = Golden's party EXP curves: party members need 40 percent more EXP for each level.

[setting encounters]
kind = toggle
default = on
apply = restart
group = GOLDEN TABLES
label = RANDOM ENCOUNTERS
help = Golden's random encounters and dungeon treasure: which Shadows each floor sends, how many roam, how often rare ones appear and what the chests hold. Shadows only Golden has stay out. Applies only with ENEMIES on.

[setting perk_order]
kind = toggle
default = on
apply = restart
group = GOLDEN SOCIAL LINKS
label = PERK ORDER
help = Party Social Link battle perks come at Golden's ranks: help a downed ally at 1, follow-up at 3, cure severe ailments at 5, endure a mortal blow at 7, take a mortal blow for you at 9.

[setting rank_skills]
kind = toggle
default = on
apply = restart
group = GOLDEN SOCIAL LINKS
label = PERSONA SKILLS
help = Party Social Links teach their member's Persona skills at Golden's ranks (mostly 2, 4, 6, 8 and MAX; Rise's navigator skills at 2 to 5). With eight skills already, the new one waits in MODS > p4pc.golden > PERSONA SKILLS.

[setting bike_rides]
kind = toggle
default = on
apply = restart
group = GOLDEN SOCIAL LINKS
label = BIKE RIDES
help = From 8/24, once a day during the day, ride with a party member from the Moel gas station in Shopping District, South (SELECT), unless the story holds the day (as at the 12/05 investigation). Talking about the future teaches their Persona its next ride skill; sharing memories brings back a skill it once learned. A ride ends that time of day. With eight skills, the new one waits in PERSONA SKILLS.

[table-derived golden]
producer = p4pc:golden
revision = 1
inputs = item skill unit msg persona encount
