[mod]
id = p4pc.randomizer
name = Seeded randomizer
version = 1.0.0
api = 1.6
requires = tables.overlay@2, artifacts@1, budget@1, sha256@1
priority = 0
order = 0

# OFF by default, and every feature OFF. With RANDOMIZE NEW GAMES on and at
# least one feature on, the next New Game generates a run from the seed shown on
# this mod's SEEDED RANDOMIZER page (32 hexadecimal digits; all zero is valid).
# The run is saved with the game: a loaded randomized save keeps the run it
# started with, whatever the settings say. Spoiler logs are written under
# mod-artifacts/p4pc.randomizer/runs/ beside the settings file.

[setting randomize]
kind = toggle
default = off
label = RANDOMIZE NEW GAMES
help = Applies from the next New Game, with the seed on the SEEDED RANDOMIZER page and the features below. A game already in progress never changes. New Game+ is not randomized.
group = RUN

[setting r1_skills]
kind = toggle
default = off
label = R1 PERSONA SKILLS
help = Shuffles the skills Personas start with and learn among skills of the same kind (damage, healing, support, ailment, passive...) learned at similar levels. Levels and slot counts stay; no Persona learns a skill twice. Izanagi and party Personas keep theirs.
group = FEATURES

[setting r2_stats]
kind = toggle
default = off
label = R2 PERSONA STATS
help = Redistributes each Persona's St/Ma/En/Ag/Lu and its level-up growth within the original totals; each value stays within half to one and a half times the original. Level, arcana and EXP are unchanged.
group = FEATURES

[setting r3_affinities]
kind = toggle
default = off
label = R3 PERSONA AFFINITIES
help = Swaps whole affinity profiles between Personas of similar level, then reorders Phys/Fire/Ice/Elec/Wind and Light/Dark responses within each profile. The number of weaknesses, resistances and immunities stays the same. Izanagi and party Personas keep theirs.
group = FEATURES

[setting r4_fusion]
kind = toggle
default = off
label = R4 FUSION RESULTS
help = Shuffles which arcana two (or three) Personas of different arcana fuse into. Same-arcana fusions, special recipes, unlock conditions and the level rules stay, every arcana stays a fusion result as often as before, and every Persona obtainable in the original game stays obtainable by the same progression.
group = FEATURES

[setting r5_enemies]
kind = toggle
default = off
label = R5 ENEMY PLACEMENT
help = Shuffles which Shadow groups each dungeon floor's encounter table holds. A group moves only between normal, rare-Shadow and other special slots of its own kind, to a slot whose original group has as many Shadows and is within three levels of it; with R6 off, only where its Shadows already fit the original Shadows' HP, SP, attack and stats, so few groups move: turn on R6 for full variety. Encounter rates, bosses and story fights stay.
group = FEATURES

[setting r6_enemy_stats]
kind = toggle
default = off
label = R6 ENEMY STATS
help = Gives each ordinary Shadow on a dungeon floor HP, SP, attack and stats scaled to the floor's original Shadows (within 75-125% for HP, SP and attack, 80-120% for stats), and the original Shadows' EXP and yen. With R5 off it varies the Shadows already there. Bosses and story fights stay.
group = FEATURES

[setting r7_drops]
kind = toggle
default = off
label = R7 ENEMY DROPS
help = Shuffles the materials and consumables ordinary Shadows drop between Shadows of the same ten-level band. Drop chances, quest drops and bosses stay, so every material stays obtainable in the same part of the game.
group = FEATURES

[setting r8_chests]
kind = toggle
default = off
label = R8 CHEST CONTENTS
help = Shuffles the items in dungeon chest tables between chests of the same item kind and price tier. Locked chests stay locked, chest frequencies stay, and fixed story chests are untouched.
group = FEATURES

[setting r9_shops]
kind = toggle
default = off
label = R9 SHOP OFFERS
help = Shuffles which weapon, armor or accessory each of Daidara's material unlocks gives. An item still unlocks by selling materials, always for the same character, gender and price range, and each material unlocks exactly one item; the opening stock, prices, consumables and materials stay.
group = FEATURES

[setting r10_shuffle]
kind = toggle
default = off
label = R10 SHUFFLE TIME CARDS
help = Each Persona card Shuffle Time offers is redrawn from the same pool the game drew it from (Personas you own, above your level, or within your level window), with this run's own seed for that Shuffle Time. Which Personas can appear, the number of cards and every other card stay the same.
group = FEATURES

[setting r11_starter]
kind = toggle
default = off
label = R11 STARTING PERSONA
help = Gives the protagonist a second, randomly chosen ordinary Persona of level 1 to 3 on the first day of free play (04/16), built from this run's Persona data. Izanagi stays, since the story's first fights are written for it. Granted once; loading a save never grants it again.
group = FEATURES

[setting r12_music]
kind = toggle
default = off
label = R12 BATTLE MUSIC
help = Permutes the ordinary battle music between dungeon encounters when the game has more than one ordinary battle track. On this disc every ordinary battle uses the same track, so it maps to itself and nothing changes; the spoiler log says so. Boss, story and event music always stay.
group = FEATURES
